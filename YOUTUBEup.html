<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tìm Video — Compact Charging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181D; --ink-2:#5A5F6B; --line:#E3E2DC; --paper:#F2F2EE; --card:#FFFFFF;
    --charge:#F5A524; --charge-deep:#C97F0A; --ok:#1FA86B; --no:#DD4A3F; --cc:#2E7CE6; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}

  header{padding:38px 0 22px;}
  .badge{display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; color:var(--charge-deep); background:#FBEFD6; border:1px solid #F3DDB0; padding:5px 11px; border-radius:999px;}
  .bolt{width:13px; height:13px; display:inline-block;}
  h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,5vw,46px); line-height:1.05; letter-spacing:-.02em; margin:16px 0 8px;}
  h1 em{font-style:normal; color:var(--charge-deep);}
  .sub{color:var(--ink-2); max-width:62ch; font-size:15px;}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin:24px 0; box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  label{display:block; font-weight:600; font-size:13px; margin-bottom:7px;}
  .hint{font-size:12px; color:var(--ink-2); font-weight:400; margin-left:6px;}
  input[type=text],input[type=password],input[type=number],select{width:100%; padding:11px 13px; font-size:15px; font-family:inherit; border:1px solid var(--line); border-radius:10px; background:#FCFCFA; color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--charge); outline-offset:0; border-color:transparent;}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:620px){.row{grid-template-columns:1fr;}}

  .keyRow{display:flex; gap:8px;}
  .keyRow input{flex:1;}
  .miniBtn{white-space:nowrap; font-size:13px; font-weight:600; padding:0 16px; border:1px solid var(--charge-deep); border-radius:10px; background:var(--charge); color:#16181D; cursor:pointer;}
  .keySaved{display:flex; align-items:center; gap:10px; font-size:14px; color:#157A4D; background:#E4F6EE; border:1px solid #Bfe6d2; padding:11px 14px; border-radius:10px;}
  .keySaved a{color:var(--charge-deep); font-weight:600; cursor:pointer; text-decoration:underline;}

  .gauge{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:9px;}
  .cell{font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; padding:8px 13px; border:1px solid var(--line); background:#FCFCFA; color:var(--ink-2); border-radius:8px; cursor:pointer; transition:.12s;}
  .cell:hover{border-color:var(--charge);}
  .cell.on{background:linear-gradient(var(--charge),var(--charge-deep)); color:#fff; border-color:var(--charge-deep);}

  .go{width:100%; margin-top:6px; padding:14px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; color:#16181D; border:none; border-radius:11px; background:linear-gradient(var(--charge),var(--charge-deep)); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; transition:.12s;}
  .go:hover{filter:brightness(1.05);}
  .go:disabled{opacity:.6; cursor:wait;}

  #status{font-size:14px; margin:10px 0 0; min-height:20px; font-family:'IBM Plex Mono',monospace;}
  #status.err{color:var(--no);} #status.ok{color:var(--ok);} #status.info{color:var(--ink-2);}

  .toolbar{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin:30px 0 14px;}
  .toolbar h2{font-family:'Space Grotesk',sans-serif; font-size:20px; margin:0;}
  .ghost{font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:9px 14px; border:1px solid var(--line); background:var(--card); border-radius:9px; cursor:pointer; color:var(--ink);}
  .ghost:hover{border-color:var(--charge);}

  #results{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; align-items:start;}
  .vid{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column;}
  .frame{position:relative; aspect-ratio:16/9; background:#000;}
  .frame iframe,.frame img{position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover;}
  .noembed{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#fff; background:#1a1a1a; text-align:center; padding:14px;}
  .noembed a{color:var(--charge); font-weight:600; text-decoration:none;}
  .vbody{padding:14px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .vtitle{font-weight:600; font-size:14.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .meta{font-size:12.5px; color:var(--ink-2);}
  .stats{display:flex; gap:14px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink);}
  .stats b{font-weight:600;}
  .tags{display:flex; flex-wrap:wrap; gap:6px;}
  .tag{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:7px; font-family:'IBM Plex Mono',monospace;}
  .tag.ok{background:#E4F6EE; color:#157A4D;} .tag.no{background:#FCE7E5; color:#B43329;}
  .tag.cc{background:#E5EFFC; color:#1E5DB8;} .tag.neutral{background:#EFEFEA; color:var(--ink-2);}
  .links{margin-top:auto; padding-top:8px; border-top:1px dashed var(--line);}
  .links a.watch{font-size:13px; font-weight:600; color:var(--charge-deep); text-decoration:none;}

  footer{padding:34px 0; color:var(--ink-2); font-size:12.5px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="badge">
      <svg class="bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      CÔNG CỤ TÌM VIDEO
    </span>
    <h1>Tìm video sản phẩm trên <em>YouTube</em></h1>
    <p class="sub">Nhập từ khóa để tìm video trên YouTube, lọc theo lượt xem và xem trực tiếp ngay trên trang.</p>
  </header>

  <div class="panel">

    <div id="keyArea" class="field">
      <div id="keyInputWrap">
        <label>API key — YouTube Data API v3 <span class="hint">nhập 1 lần, được lưu sẵn cho lần sau</span></label>
        <div class="keyRow">
          <input type="password" id="apiKey" placeholder="AIza..." autocomplete="off">
          <button class="miniBtn" onclick="saveKey()">Lưu key</button>
        </div>
      </div>
      <div id="keySaved" class="keySaved" style="display:none;">
        <span>✓ Đã lưu API key.</span><a onclick="changeKey()">Đổi key</a>
      </div>
    </div>

    <div class="field">
      <label>Từ khóa / tên sản phẩm</label>
      <input type="text" id="keyword" placeholder="ví dụ: củ sạc nhanh 65W, pin dự phòng MagSafe...">
    </div>

    <div class="field">
      <label>Lượt xem tối thiểu <span class="hint">chọn nhanh hoặc nhập số</span></label>
      <div class="gauge" id="gauge">
        <button type="button" class="cell on" data-v="0">Tất cả</button>
        <button type="button" class="cell" data-v="1000">1K+</button>
        <button type="button" class="cell" data-v="10000">10K+</button>
        <button type="button" class="cell" data-v="100000">100K+</button>
        <button type="button" class="cell" data-v="1000000">1Tr+</button>
        <button type="button" class="cell" data-v="10000000">10Tr+</button>
      </div>
      <input type="number" id="minViews" value="0" min="0" step="1000">
    </div>

    <div class="row">
      <div class="field">
        <label>Sắp xếp</label>
        <select id="order">
          <option value="relevance">Liên quan nhất</option>
          <option value="viewCount">Nhiều view nhất</option>
          <option value="date">Mới nhất</option>
          <option value="rating">Đánh giá cao</option>
        </select>
      </div>
      <div class="field">
        <label>Số video muốn lấy</label>
        <input type="number" id="count" value="12" min="1" max="50">
      </div>
    </div>

    <button class="go" id="goBtn" onclick="searchYouTube()">
      <svg class="bolt" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
      <span>Tìm video</span>
    </button>
    <p id="status"></p>
  </div>

  <div class="toolbar" id="toolbar" style="display:none;">
    <h2 id="resultTitle">Kết quả</h2>
    <button class="ghost" onclick="exportCSV()">⬇ Xuất CSV</button>
  </div>
  <div id="results"></div>

  <footer>Compact Charging · Chạy hoàn toàn trên trình duyệt. API key chỉ lưu trên máy bạn.</footer>
</div>

<script>
/* ====== Cấu hình & trạng thái ====== */
const API='https://www.googleapis.com/youtube/v3';
const KEY_STORE='cc_yt_api_key';
let ytResults=[];

/* --- localStorage an toàn --- */
function readStoredKey(){ try{ return localStorage.getItem(KEY_STORE)||''; }catch(e){ return ''; } }
function writeStoredKey(v){ try{ localStorage.setItem(KEY_STORE,v); }catch(e){} }

/* --- API key: lưu & ẩn --- */
function showKeySaved(){ document.getElementById('keyInputWrap').style.display='none'; document.getElementById('keySaved').style.display='flex'; }
function showKeyInput(){ document.getElementById('keyInputWrap').style.display='block'; document.getElementById('keySaved').style.display='none'; }
function saveKey(){ const v=document.getElementById('apiKey').value.trim();
  if(!v){ status('Hãy dán API key trước khi lưu.','err'); return; }
  writeStoredKey(v); showKeySaved(); status('Đã lưu API key — lần sau không phải nhập lại.','ok'); }
function changeKey(){ showKeyInput(); document.getElementById('apiKey').value=readStoredKey(); document.getElementById('apiKey').focus(); }
function getKey(){ return readStoredKey() || document.getElementById('apiKey').value.trim(); }
(function init(){ if(readStoredKey()) showKeySaved(); })();

/* --- Tiện ích --- */
function status(msg,type){ const el=document.getElementById('status'); el.textContent=msg; el.className=type||''; }
function setLoading(on){ document.getElementById('goBtn').disabled=on; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n){ n=Number(n)||0; if(n>=1e9)return(n/1e9).toFixed(1).replace('.0','')+' tỷ'; if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+' tr'; if(n>=1e3)return(n/1e3).toFixed(1).replace('.0','')+'K'; return n.toLocaleString('vi-VN'); }
function parseDur(iso){ const m=String(iso||'').match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m)return''; const h=+(m[1]||0),mi=+(m[2]||0),s=+(m[3]||0); const mm=h>0?String(mi).padStart(2,'0'):String(mi); return (h>0?h+':':'')+mm+':'+String(s).padStart(2,'0'); }
function friendlyError(e){ const r=e&&(e.errors&&e.errors[0]&&e.errors[0].reason);
  if(r==='quotaExceeded')return'Hết hạn mức API hôm nay. Thử lại ngày mai hoặc xin tăng quota.';
  if(r==='keyInvalid')return'API key không hợp lệ. Bấm "Đổi key" để nhập lại.';
  if(r==='accessNotConfigured')return'Chưa bật YouTube Data API v3 cho dự án.';
  if(r==='ipRefererBlocked')return'Key bị chặn theo domain. Thêm nonameta.github.io/* vào referrers.';
  return 'Lỗi: '+(e&&e.message?e.message:JSON.stringify(e)); }

document.querySelectorAll('.cell').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.cell').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  document.getElementById('minViews').value=btn.dataset.v; }));
document.getElementById('minViews').addEventListener('input',()=>document.querySelectorAll('.cell').forEach(b=>b.classList.remove('on')));
document.getElementById('keyword').addEventListener('keydown',e=>{ if(e.key==='Enter') searchYouTube(); });

/* ====== Tìm trên YouTube ====== */
async function searchYouTube(){
  const q=document.getElementById('keyword').value.trim();
  if(!q){ status('Hãy nhập từ khóa / tên sản phẩm.','err'); return; }
  const apiKey=getKey();
  if(!apiKey){ status('Bạn cần nhập API key YouTube trước.','err'); showKeyInput(); return; }
  if(!readStoredKey()){ writeStoredKey(apiKey); showKeySaved(); }

  const order=document.getElementById('order').value;
  const minViews=Number(document.getElementById('minViews').value)||0;
  const want=Math.max(1,Math.min(50,Number(document.getElementById('count').value)||12));

  setLoading(true); status('Đang tìm video...','info'); document.getElementById('results').innerHTML='';
  try{
    const r=await fetch(`${API}/search?part=snippet&type=video&maxResults=50&q=${encodeURIComponent(q)}&order=${order}&key=${apiKey}`);
    const d=await r.json(); if(d.error) throw d.error;
    const ids=[...new Set((d.items||[]).map(i=>i.id&&i.id.videoId).filter(Boolean))];
    if(!ids.length){ status('Không tìm thấy video nào.','err'); setLoading(false); return; }
    let details=[];
    for(let i=0;i<ids.length;i+=50){
      const r2=await fetch(`${API}/videos?part=snippet,statistics,status,contentDetails&id=${ids.slice(i,i+50).join(',')}&key=${apiKey}`);
      const d2=await r2.json(); if(d2.error) throw d2.error; details.push(...(d2.items||[]));
    }
    let out=details.filter(v=>Number(v.statistics&&v.statistics.viewCount||0)>=minViews);
    out.sort((a,b)=>Number(b.statistics.viewCount||0)-Number(a.statistics.viewCount||0));
    out=out.slice(0,want);
    if(!out.length){ status('Không có video nào đạt ngưỡng lượt xem.','err'); setLoading(false); return; }
    ytResults=out; renderYouTube(out); status(`Tìm thấy ${out.length} video phù hợp.`,'ok');
  }catch(e){ status(friendlyError(e),'err'); }
  setLoading(false);
}

function renderYouTube(list){
  const tb=document.getElementById('toolbar');
  if(!list.length){ tb.style.display='none'; document.getElementById('results').innerHTML=''; return; }
  tb.style.display='flex';
  document.getElementById('resultTitle').textContent=`Kết quả YouTube (${list.length})`;
  document.getElementById('results').innerHTML=list.map(v=>{
    const id=v.id,s=v.snippet||{},st=v.statistics||{},sta=v.status||{},cd=v.contentDetails||{};
    const url=`https://www.youtube.com/watch?v=${id}`;
    const thumb=((s.thumbnails&&(s.thumbnails.medium||s.thumbnails.default))||{}).url||'';
    const embeddable=!!sta.embeddable, cc=sta.license==='creativeCommon';
    const date=s.publishedAt?new Date(s.publishedAt).toLocaleDateString('vi-VN'):'';
    const player=embeddable
      ? `<iframe loading="lazy" src="https://www.youtube.com/embed/${id}" allowfullscreen></iframe>`
      : `<img loading="lazy" src="${thumb}" alt=""><div class="noembed"><span>Video không cho nhúng</span><a href="${url}" target="_blank" rel="noopener">▶ Xem trên YouTube</a></div>`;
    return `<div class="vid"><div class="frame">${player}</div><div class="vbody">
      <div class="vtitle">${esc(s.title)}</div>
      <div class="meta">${esc(s.channelTitle)} · ${date}${cd.duration?` · ${parseDur(cd.duration)}`:''}</div>
      <div class="stats"><span><b>${fmt(st.viewCount)}</b> view</span>${st.likeCount?`<span><b>${fmt(st.likeCount)}</b> thích</span>`:''}</div>
      <div class="tags"><span class="tag ${embeddable?'ok':'no'}">${embeddable?'Cho phép nhúng':'Không cho nhúng'}</span><span class="tag ${cc?'cc':'neutral'}">${cc?'Creative Commons':'Bản quyền chuẩn'}</span></div>
      <div class="links"><a class="watch" href="${url}" target="_blank" rel="noopener">🔗 Link video gốc</a></div>
    </div></div>`;
  }).join('');
}

/* ====== Xuất CSV ====== */
function exportCSV(){
  if(!ytResults.length){ status('Chưa có kết quả để xuất.','err'); return; }
  const rows=[['Tiêu đề','Kênh','Link video','Lượt xem','Cho phép nhúng','Giấy phép']];
  ytResults.forEach(v=>{ const id=v.id,s=v.snippet||{},st=v.statistics||{},sta=v.status||{};
    rows.push([(s.title||'').replace(/"/g,'""'),(s.channelTitle||'').replace(/"/g,'""'),`https://www.youtube.com/watch?v=${id}`,st.viewCount||0,sta.embeddable?'Có':'Không',sta.license==='creativeCommon'?'Creative Commons':'Bản quyền chuẩn']); });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download='danh-sach-video.csv'; a.click();
}
</script>
</body>
</html>
