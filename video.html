<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tìm video — không cần API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E0F13; --surface:#16181E; --elevated:#1C1F27;
    --border:#272B34; --text:#E7E8EC; --muted:#9095A1;
    --accent:#5B8CFF; --accent-soft:rgba(91,140,255,.14);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .wrap{max-width:640px;width:100%;padding:32px 22px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  header{text-align:center;margin-bottom:30px}
  h1{font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:11px}
  h1 .play{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;font-size:17px}
  header p{color:var(--muted);font-size:15px;margin-top:8px}

  /* Ô tìm kiếm */
  .search{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 6px 6px 20px;margin-bottom:14px;transition:border-color .2s}
  .search:focus-within{border-color:var(--accent)}
  .search input{flex-grow:1;background:none;border:none;color:var(--text);font-size:16px;font-family:inherit;outline:none}
  .search input::placeholder{color:#5b606c}

  .note{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}

  /* Lưới nền tảng */
  .platforms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .plat{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;text-align:left;font-family:inherit;color:var(--text);transition:border-color .2s,transform .12s,background .2s}
  .plat:hover{border-color:var(--accent);background:var(--elevated);transform:translateY(-2px)}
  .plat .ico{font-size:24px;width:30px;text-align:center;flex-shrink:0}
  .plat .t{font-size:15px;font-weight:600}
  .plat .d{font-size:12px;color:var(--muted)}

  .all{margin-top:14px}
  .all button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:15px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s}
  .all button:hover{transform:translateY(-2px)}

  @media(max-width:480px){ .platforms{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="play">▶</span> Tìm video</h1>
    <p>Gõ từ khóa, chọn nền tảng — không cần cài đặt gì cả.</p>
  </header>

  <div class="search">
    <input id="q" type="text" placeholder="Nhập từ khóa cần tìm..." autofocus
           onkeydown="if(event.key==='Enter')go('youtube')">
  </div>
  <div class="note">Bấm một nền tảng bên dưới để mở trang kết quả video của nền tảng đó.</div>

  <div class="platforms">
    <button class="plat" onclick="go('youtube')">
      <span class="ico">▶️</span><span><div class="t">YouTube</div><div class="d">Kho video lớn nhất</div></span>
    </button>
    <button class="plat" onclick="go('tiktok')">
      <span class="ico">🎵</span><span><div class="t">TikTok</div><div class="d">Video ngắn</div></span>
    </button>
    <button class="plat" onclick="go('facebook')">
      <span class="ico">📘</span><span><div class="t">Facebook</div><div class="d">Video & Reels</div></span>
    </button>
    <button class="plat" onclick="go('google')">
      <span class="ico">🔍</span><span><div class="t">Google Video</div><div class="d">Tìm khắp web</div></span>
    </button>
    <button class="plat" onclick="go('vimeo')">
      <span class="ico">🎬</span><span><div class="t">Vimeo</div><div class="d">Video chất lượng cao</div></span>
    </button>
    <button class="plat" onclick="go('dailymotion')">
      <span class="ico">📹</span><span><div class="t">Dailymotion</div><div class="d">Video đa dạng</div></span>
    </button>
  </div>

  <div class="all">
    <button onclick="goAll()">Mở tất cả nền tảng cùng lúc</button>
  </div>

</div>

<script>
  // Địa chỉ trang TÌM KIẾM VIDEO của từng nền tảng. {q} sẽ được thay bằng từ khóa.
  const URLS = {
    youtube:     "https://www.youtube.com/results?search_query={q}",
    tiktok:      "https://www.tiktok.com/search/video?q={q}",
    facebook:    "https://www.facebook.com/watch/search/?q={q}",
    google:      "https://www.google.com/search?tbm=vid&q={q}",
    vimeo:       "https://vimeo.com/search?q={q}",
    dailymotion: "https://www.dailymotion.com/search/{q}/videos"
  };

  function getQ(){ return document.getElementById('q').value.trim(); }

  function go(platform){
    const q = getQ();
    if(!q){ document.getElementById('q').focus(); return; }
    const url = URLS[platform].replace('{q}', encodeURIComponent(q));
    window.open(url, '_blank', 'noopener');
  }

  // Mở vài nền tảng chính cùng lúc (trình duyệt có thể hỏi cho phép mở nhiều tab)
  function goAll(){
    const q = getQ();
    if(!q){ document.getElementById('q').focus(); return; }
    ['youtube','tiktok','facebook','google'].forEach(p=>{
      window.open(URLS[p].replace('{q}', encodeURIComponent(q)), '_blank', 'noopener');
    });
  }
</script>

<!--
============================================================
TRANG NÀY KHÔNG CẦN API, KHÔNG CẦN CÀI ĐẶT GÌ.
Cách hoạt động: gõ từ khóa -> bấm nền tảng -> mở thẳng trang
kết quả video của nền tảng đó trong tab mới.

Muốn thêm/bớt nền tảng: sửa danh sách URLS trong phần <script>.
Khi đưa lên GitHub/Vercel, đổi tên file này thành index.html
============================================================
-->
</body>
</html>
